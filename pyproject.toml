[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rignostic"
version = "0.0.1"
description = "Incremental agentic facial-rig QA for Blender"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1,<4",
    "flask-login>=0.6,<1",
    "flask-sqlalchemy>=3.1,<4",
    "gunicorn>=23,<24",
    "litellm>=1,<2",
    "python-dotenv>=1,<2",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
rignostic = "rignostic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rignostic.web" = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live_model: makes a real, potentially billable model API call"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
