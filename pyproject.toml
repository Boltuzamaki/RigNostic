[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rignostic"
version = "0.0.1"
description = "Incremental agentic facial-rig QA for Blender"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1,<2",
    "openai>=1,<3",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
rignostic = "rignostic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live_model: makes a real, potentially billable model API call"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
