{% macro progress(run) %}<div id="run-status" data-events-url="{{ url_for('pages.events', run_id=run.id) }}" class="panel"><div class="flex items-center justify-between"><span class="label">Analysis status</span><span data-status>{{ run.status }}</span></div><p data-step class="mt-4 text-lg">{{ run.current_step }}</p><p data-error class="mt-2 text-sm text-blackice-danger">{{ run.error or '' }}</p></div>{% endmacro %}
