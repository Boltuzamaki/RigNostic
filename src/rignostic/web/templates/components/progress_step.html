{% macro progress(run) %}<div id="run-status" data-events-url="{{ url_for('pages.events', run_id=run.id) }}" class="panel"><div class="flex items-center justify-between"><span class="label">Analysis status</span><span data-status>{{ run.status }}</span></div><p data-step class="mt-4 text-lg">{{ run.current_step }}</p><div class="progress-track" role="progressbar" aria-label="Analysis progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ run.progress }}"><div data-progress class="progress-fill" style="width:{{ run.progress }}%"></div></div><div class="mt-2 flex items-center justify-between text-xs text-blackice-muted"><span data-progress-label>{{ run.progress }}%</span><span>Saved automatically</span></div><p data-error class="mt-2 text-sm text-blackice-danger">{{ run.error or '' }}</p></div>{% endmacro %}
