{% macro trajectory_step(event) %}<li class="border-l border-blackice-primary/40 pb-5 pl-5"><div class="flex flex-wrap items-center gap-2">{% if event.type %}<span class="status-badge {{ 'status-bad' if event.type == 'rejected_action' else 'status-warn' }}">{{ event.type|replace('_', ' ') }}</span>{% endif %}{% if event.tool %}<code class="font-mono text-xs text-blackice-primary">{{ event.tool }}</code>{% endif %}</div><p class="mt-2 text-sm">{{ event.step or event.summary }}</p><time class="font-mono text-xs text-blackice-muted">{{ event.timestamp }}</time></li>{% endmacro %}
