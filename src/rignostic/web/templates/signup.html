{% extends 'base.html' %}{% block title %}Sign up · RigNostic{% endblock %}{% block content %}<div class="mx-auto max-w-2xl"><p class="eyebrow">Private workspace</p><h1>Create account</h1>{% if error %}<div class="alert mt-5">{{ error }}</div>{% endif %}<form method="post" class="panel mt-6"><label class="label" for="username">Username</label><input class="text-input" id="username" name="username" minlength="3" maxlength="40" autocomplete="username" required><label class="label mt-5 block" for="email">Email</label><input class="text-input" id="email" name="email" type="email" autocomplete="email" required><label class="label mt-5 block" for="password">Password</label><input class="text-input" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><button class="button mt-5" type="submit">Create account</button><p class="copy">Already registered? <a class="text-blackice-primary" href="{{ url_for('pages.login') }}">Log in</a>.</p></form></div>{% endblock %}
